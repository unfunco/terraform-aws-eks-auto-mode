name: PR

on:
  pull_request:
    paths-ignore:
    - .editorconfig
    - .gitattributes
    - .gitignore
    - CHANGELOG.md
    - LICENSE.md
    - README.md

jobs:
  verify:
    name: Verify
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@dc15f9a32fe01b1b7cc44e095ab9e9bdd98bb0b7
    with:
      terraform-version-file: .terraform-version
      working-directory: .
